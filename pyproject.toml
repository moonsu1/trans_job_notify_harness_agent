[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-scout"
version = "0.1.0"
description = "Daily evidence-based Korean AI career scout"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=2.0,<3", "langgraph>=1,<2", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "playwright>=1.50,<2", "pypdf>=5,<7", "keyring>=25,<26",
  "tzdata>=2025", "filelock>=3.16,<4", "tiktoken>=0.9,<1",
  "ormsgpack==1.12.2",
  "jiter==0.10.0",
  "protego>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
career-scout = "career_scout.cli:main"

[tool.setuptools.packages.find]
include = ["career_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
